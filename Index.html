<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
 <section class="contact-form">
    <h2>Contact Us</h2>
    <form id="contact-form" novalidate>


        <div class="name-fields">
            <div>
                <label for="first-name">First Name<span class="required">*</span> </label>
                <input type="text" id="first-name">
                <span class="error" id="first-name-error"></span>
            </div>
            <div>
                <label for="last-name">Last Name<span class="required">*</span> </label>
                <input type="text" id="last-name">
                <span class="error" id="last-name-error"></span>
            </div>
        </div>
        <br>
        <div class="full-width"> 
            <label for="email">Email address<span class="required">*</span></label>
            <input type="email" id="email" name="email">
            <span class="error" id="email-error"></span>
        </div>

        <div class="query-type">
            <label>Query Type <span class="required">*</span></label>
            <div>
                <label class="input-box"><input type="radio" name="query" value="General Enquiry" required> General Enquiry</label>
                <label class="input-box"><input type="radio" name="query" value="Support Request"> Support Request</label>
            </div>
        </div>
        <span class="error" id="query-error"></span><br>

        <div class="full-width">
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <span class="error" id="message-error"></span><br>
        </div>

         <label class="checkbox">
            <input type="checkbox" id="consent" required>
            I consent to being contacted by the team <span class="required">*</span>
        </label>
        <span class="error" id="consent-error"></span>
        <br>
        <button type="submit">Send Message</button>
        <div id="success-popup" class="success-popup">
            ✅ Form submitted successfully! We will get back to you soon.
        </div>
    </form>  
    </section> 

    <script src="./Script.js"></script>
</body>
</html>
